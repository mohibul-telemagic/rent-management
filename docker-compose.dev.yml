services:
  backend:
    image: gradle:8.10.2-jdk21-alpine
    container_name: rentease-backend-dev
    working_dir: /workspace
    command: >
      sh -c "chmod +x gradlew &&
      ./gradlew bootRun --args='--spring.profiles.active=local' --no-daemon"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175
      JWT_ALLOW_EPHEMERAL_KEY_PAIR: "true"
      PII_AES256_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-owner@rentease.bd}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-Owner@123}
    volumes:
      - ./backend:/workspace
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    container_name: rentease-frontend-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  gradle-cache:
  frontend-node-modules:
