spring:
  application:
    name: renteasebd-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/renteasebd}
    username: ${SPRING_DATASOURCE_USERNAME:rentease}
    password: ${SPRING_DATASOURCE_PASSWORD:rentease}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Dhaka
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Dhaka

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    private-key-pem: ${JWT_PRIVATE_KEY_B64:}
    public-key-pem: ${JWT_PUBLIC_KEY_B64:}
    access-token-ttl: PT24H
    refresh-token-ttl: P30D
    allow-ephemeral-key-pair: ${JWT_ALLOW_EPHEMERAL_KEY_PAIR:true}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
    auth-rate-limit-max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
    auth-rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  crypto:
    aes256-key-base64: ${PII_AES256_KEY_B64:}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:owner@rentease.bd}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Owner@123}
  invoice:
    public-base-url: ${PUBLIC_INVOICE_BASE_URL:http://localhost:8080}
    public-link-ttl-days: ${PUBLIC_INVOICE_LINK_TTL_DAYS:7}
