spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.data/renteasebd-local;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update

app:
  crypto:
    aes256-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  bootstrap:
    admin-email: owner@rentease.bd
    admin-password: Owner@123
